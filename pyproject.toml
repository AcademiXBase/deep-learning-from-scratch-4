[project]
name = "deep-learning-from-scratch-4"
version = "0.1.0"
description = "Code examples for Deep Learning from Scratch 4"
readme = "README.md"
# NumPy 1.23.5 supports Python up to 3.11.
requires-python = ">=3.11,<3.12"
dependencies = [
    "dezero==0.0.13",
    # Preserve the book's reset(), step(), and render() APIs.
    "gym==0.23.1",
    "matplotlib>=3.7,<4",
    # DeZero and the PyTorch examples use aliases removed in NumPy 1.24.
    "numpy==1.23.5",
    # gym[classic_control] pins pygame 2.1.0, which lacks Python 3.11 wheels.
    "pandas>=2.3.3",
    "pygame>=2.6.1,<3",
]

[project.optional-dependencies]
notebooks = [
    "dezerogym==0.0.0",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4,<5",
]
pytorch = [
    "torch>=2.2,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
